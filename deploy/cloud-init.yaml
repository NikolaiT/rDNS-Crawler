#cloud-config
# Prepares an Ubuntu node for rDNS crawling:
#   - installs a LOCAL recursive resolver (unbound) so the node resolves PTRs by
#     talking to authoritative servers directly from its own IP — no third-party
#     public-resolver rate limits when we fire billions of queries.
#   - raises file-descriptor and ephemeral-port limits for high concurrency.
# The crawler binary + systemd unit are pushed later by deploy.sh.
package_update: true
package_upgrade: false
packages:
  - unbound
  - ca-certificates

write_files:
  - path: /etc/unbound/unbound.conf.d/rdns.conf
    content: |
      server:
        interface: 127.0.0.1
        port: 53
        do-ip6: no
        access-control: 127.0.0.0/8 allow
        # Performance for heavy PTR workloads.
        num-threads: 4
        msg-cache-size: 128m
        rrset-cache-size: 256m
        cache-max-ttl: 86400
        cache-min-ttl: 300
        prefetch: yes
        so-reuseport: yes
        outgoing-range: 8192
        num-queries-per-thread: 4096
        # We only need recursion for reverse zones; keep it lean.
        qname-minimisation: yes
        harden-glue: yes
        hide-identity: yes
        hide-version: yes

  - path: /etc/sysctl.d/99-rdns.conf
    content: |
      net.ipv4.ip_local_port_range = 1024 65535
      net.core.rmem_max = 8388608
      net.core.wmem_max = 8388608
      fs.file-max = 2000000

  - path: /etc/security/limits.d/99-rdns.conf
    content: |
      * soft nofile 1048576
      * hard nofile 1048576
      root soft nofile 1048576
      root hard nofile 1048576

runcmd:
  - sysctl --system
  - systemctl enable --now unbound
  - mkdir -p /opt/rdns/OUTPUT
  # Only signal READY once unbound actually answers; deploy.sh keys off this.
  - 'for i in $(seq 1 60); do unbound-control status >/dev/null 2>&1 && break; sleep 2; done'
  - echo "cloud-init rdns setup complete" > /opt/rdns/READY
